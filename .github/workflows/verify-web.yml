name: Verify web build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - name: Check exported icons
        run: |
          test -s out/favicon.ico
          test -s out/apple-icon.png
          test -s out/manifest.webmanifest
          test -s out/icons/ayet-192.png
          test -s out/icons/ayet-512.png
